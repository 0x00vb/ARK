[workspace]
resolver = "2"
members = [
    "crates/ark-core",
    "crates/ark-model",
    "crates/ark-store",
    "crates/ark-tools",
    "crates/ark-files",
    "crates/ark-connect",
    "crates/ark-account",
    "crates/ark-browser",
    "crates/ark-computer",
    "crates/ark-exec",
    "crates/ark-proc",
    "crates/ark-acp",
    "crates/ark-runtime",
    "crates/ark-sdk",
    "crates/ark-orchestrate",
    "crates/ark-interact",
    "crates/ark-cli",
    "crates/ark-ui",
    "crates/ark-bench",
    "examples/minimal-agent",
    "examples/writing-agent",
    "examples/agent-team",
]

[workspace.package]
version = "0.12.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/0x00vb/ARK"
description = "ARK, the Agent Runtime Kit: a domain-agnostic runtime, SDK and interactive shell for building agents."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
portable-pty = "0.9"
tempfile = "3"

# internal: the ARK crates
ark-core = { path = "crates/ark-core", version = "0.12.1" }
ark-model = { path = "crates/ark-model", version = "0.12.1" }
ark-store = { path = "crates/ark-store", version = "0.12.1" }
ark-tools = { path = "crates/ark-tools", version = "0.12.1" }
ark-files = { path = "crates/ark-files", version = "0.12.1" }
ark-connect = { path = "crates/ark-connect", version = "0.12.1" }
ark-account = { path = "crates/ark-account", version = "0.12.1" }
ark-browser = { path = "crates/ark-browser", version = "0.12.1" }
ark-computer = { path = "crates/ark-computer", version = "0.12.1" }
ark-exec = { path = "crates/ark-exec", version = "0.12.1" }
ark-proc = { path = "crates/ark-proc", version = "0.12.1" }
ark-acp = { path = "crates/ark-acp", version = "0.12.1" }
ark-runtime = { path = "crates/ark-runtime", version = "0.12.1" }
ark-sdk = { path = "crates/ark-sdk", version = "0.12.1" }
ark-orchestrate = { path = "crates/ark-orchestrate", version = "0.12.1" }
ark-interact = { path = "crates/ark-interact", version = "0.12.1" }
ark-cli = { path = "crates/ark-cli", version = "0.12.1" }
ark-ui = { path = "crates/ark-ui", version = "0.12.1", default-features = false }
ark-bench = { path = "crates/ark-bench", version = "0.12.1" }

[profile.dev]
opt-level = 1
