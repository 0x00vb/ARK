[workspace]
resolver = "2"
exclude = ["third-party/agent-desktop/macos"]
members = [
    "crates/ark-core",
    "crates/ark-os",
    "crates/ark-reach",
    "crates/ark-model",
    "crates/ark-store",
    "crates/ark-tools",
    "crates/ark-files",
    "crates/ark-connect",
    "crates/ark-account",
    "crates/ark-browser",
    "crates/ark-computer",
    "crates/ark-exec",
    "crates/ark-proc",
    "crates/ark-acp",
    "crates/ark-runtime",
    "crates/ark-sdk",
    "crates/ark-orchestrate",
    "crates/ark-interact",
    "crates/ark-protocol",
    "crates/ark-client",
    "crates/ark-cli",
    "crates/ark-ui",
    "crates/ark-transcribe",
    "crates/ark-bench",
    "examples/minimal-agent",
    "examples/writing-agent",
    "examples/agent-team",
]

[workspace.package]
version = "0.45.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/0x00vb/ARK"
description = "ARK, the Agent Runtime Kit: a domain-agnostic runtime, SDK and interactive shell for building agents."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
jiff = "0.2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
# rustls, not the system's OpenSSL: the server build runs on a stock Linux server (ADR 0052).
# Both root sets: the system's certificates, and Mozilla's built in for a server without any.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "charset",
    "system-proxy",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
futures = "0.3"
url = "2"
portable-pty = "0.9"
tempfile = "3"
png = "0.18"
tar = "0.4"

# internal: the ARK crates
ark-core = { path = "crates/ark-core", version = "0.45.0" }
ark-os = { path = "crates/ark-os", version = "0.45.0" }
ark-reach = { path = "crates/ark-reach", version = "0.45.0" }
ark-model = { path = "crates/ark-model", version = "0.45.0" }
ark-store = { path = "crates/ark-store", version = "0.45.0" }
ark-tools = { path = "crates/ark-tools", version = "0.45.0" }
ark-files = { path = "crates/ark-files", version = "0.45.0" }
ark-connect = { path = "crates/ark-connect", version = "0.45.0" }
ark-account = { path = "crates/ark-account", version = "0.45.0" }
ark-browser = { path = "crates/ark-browser", version = "0.45.0" }
ark-computer = { path = "crates/ark-computer", version = "0.45.0" }
ark-exec = { path = "crates/ark-exec", version = "0.45.0" }
ark-proc = { path = "crates/ark-proc", version = "0.45.0" }
ark-acp = { path = "crates/ark-acp", version = "0.45.0" }
ark-runtime = { path = "crates/ark-runtime", version = "0.45.0" }
ark-sdk = { path = "crates/ark-sdk", version = "0.45.0" }
ark-orchestrate = { path = "crates/ark-orchestrate", version = "0.45.0" }
ark-interact = { path = "crates/ark-interact", version = "0.45.0" }
ark-protocol = { path = "crates/ark-protocol", version = "0.45.0" }
ark-client = { path = "crates/ark-client", version = "0.45.0" }
ark-cli = { path = "crates/ark-cli", version = "0.45.0" }
ark-ui = { path = "crates/ark-ui", version = "0.45.0", default-features = false }
ark-bench = { path = "crates/ark-bench", version = "0.45.0" }
ark-transcribe = { path = "crates/ark-transcribe", version = "0.45.0" }

[profile.dev]
opt-level = 1

# Tests favor edit-to-feedback time. The suite's slow cases wait on real timing and WebKit, so
# optimizing every test dependency adds substantial compile time without shortening the run.
[profile.test]
opt-level = 0
