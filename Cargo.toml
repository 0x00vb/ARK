[workspace]
resolver = "2"
members = [
    "crates/ark-core",
    "crates/ark-model",
    "crates/ark-store",
    "crates/ark-tools",
    "crates/ark-runtime",
    "crates/ark-sdk",
    "examples/minimal-agent",
    "examples/writing-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/valentino/ark"
description = "ARK — Agent Runtime Kit: a domain-agnostic runtime, SDK, CLI, and UI foundation for building agents."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tempfile = "3"

# internal — the ARK crates
ark-core = { path = "crates/ark-core", version = "0.1.0" }
ark-model = { path = "crates/ark-model", version = "0.1.0" }
ark-store = { path = "crates/ark-store", version = "0.1.0" }
ark-tools = { path = "crates/ark-tools", version = "0.1.0" }
ark-runtime = { path = "crates/ark-runtime", version = "0.1.0" }
ark-sdk = { path = "crates/ark-sdk", version = "0.1.0" }

[profile.dev]
opt-level = 1
