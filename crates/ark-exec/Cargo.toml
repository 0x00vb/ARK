[package]
name = "ark-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ARK's Run code capability: agents run programs in the project folder, contained on macOS, Linux and Windows (no network, writes only there), and the files they write come back as artifacts."

[dependencies]
ark-os.workspace = true
ark-core.workspace = true
ark-tools.workspace = true
ark-runtime.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time", "fs"] }
uuid.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[[test]]
name = "run_windows"
harness = false
