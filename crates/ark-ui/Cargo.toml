[package]
name = "ark-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ARK graphical agent workspace: a desktop window (Tauri) or a local browser page over the same interaction layer."

[[example]]
name = "verify-page-signature"
path = "examples/verify-page-signature.rs"
required-features = ["desktop-updater"]

[features]
default = ["desktop"]
# The native window. Without it, ark-ui still serves the workspace to a local browser.
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification", "dep:tauri-plugin-single-instance"]
# Signed background updates for a packaged native app. A consumer opts in and supplies the
# endpoint and public key in its Tauri config; browser and server builds stay unchanged.
desktop-updater = ["desktop", "dep:tauri-plugin-updater", "dep:minisign-verify"]

[dependencies]
ark-os.workspace = true
ark-account.workspace = true
ark-reach.workspace = true
ark-interact.workspace = true
ark-model.workspace = true
ark-protocol.workspace = true
ark-sdk.workspace = true
ark-store.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
anyhow.workspace = true
uuid.workspace = true
portable-pty.workspace = true
reqwest.workspace = true
sha2 = "0.10"
tar.workspace = true
ring = "0.17"
tracing.workspace = true
base64 = "0.22"
async-trait.workspace = true
tempfile.workspace = true
# `unstable`: a window with more than one webview (the Browser panel, ADR 0044). Semver-exempt,
# so held to 2.12.
tauri = { version = "~2.12", optional = true, features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.13", optional = true }
minisign-verify = { version = ">=0.2, <0.4", optional = true }

[dev-dependencies]
async-trait.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["test-util"] }
rusqlite.workspace = true
