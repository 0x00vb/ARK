<!doctype html>
<html lang="en" data-theme-default="<!--ark:theme-->">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!--ark:title--></title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="app.css" />
    <!--ark:styles-->
    <script type="module" src="js/app.js"></script>
    <!--ark:scripts-->
  </head>
  <body>
    <div id="app" class="app" data-pane="closed" data-sidebar="open">
      <nav class="destinations" id="destinations" aria-label="Destinations">
        <div class="destination-drag" data-tauri-drag-region></div>
        <button class="destination" type="button" data-destination="home" aria-current="page" title="Home">
          <span class="destination-icon" data-icon="home"></span>
          <span class="destination-label">Home</span>
        </button>
        <button class="destination" type="button" data-destination="schedules" title="Schedules">
          <span class="destination-icon" data-icon="clock"></span>
          <span class="destination-label">Schedules</span>
        </button>
      </nav>
      <aside class="sidebar" aria-label="Projects">
        <div class="sidebar-top" data-tauri-drag-region>
          <button class="icon-btn" id="search-chats" title="Search chats (⇧⌘F)" aria-label="Search chats" data-icon="search"></button>
          <button class="icon-btn" id="toggle-sidebar" title="Hide sidebar (⌘B)" aria-label="Hide sidebar"></button>
        </div>
        <button class="nav-row new-session" id="new-session">
          <span class="nav-icon" data-icon="compose"></span>
          <span class="nav-label">New chat</span>
          <kbd>⌘N</kbd>
        </button>
        <div class="section-label">
          <span>Projects</span>
          <button class="icon-btn small" id="add-project" title="Add a project" aria-label="Add a project" data-icon="plus"></button>
        </div>
        <div class="sidebar-ext" id="sidebar-ext" hidden></div>
        <div class="projects" id="projects" role="tree" aria-label="Projects"></div>
        <div class="sidebar-foot">
          <div class="status-ext" id="status-ext"></div>
          <button class="nav-row" id="open-settings" hidden>
            <span class="nav-icon" data-icon="settings"></span>
            <span class="nav-label">Settings</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar" data-tauri-drag-region>
          <button class="icon-btn reveal-sidebar" id="reveal-sidebar" title="Show sidebar (⌘B)" aria-label="Show sidebar"></button>
          <div class="title" id="session-title" tabindex="-1" data-tauri-drag-region></div>
          <nav class="segs view-tabs" id="view-tabs" role="tablist" aria-label="Views" hidden></nav>
          <div class="top-actions">
            <div class="computer-use" id="computer-use" role="status" hidden></div>
            <span class="panel-launchers" id="panel-launchers"></span>
            <button class="icon-btn" id="toggle-pane" title="Side panel (⌘\\)" aria-label="Side panel"></button>
          </div>
        </header>

        <nav class="chat-tabs" id="chat-tabs" aria-label="Open chats" hidden>
          <div class="chat-tab-list" id="chat-tab-list" role="tablist"></div>
          <button class="icon-btn chat-split" id="chat-split" type="button" title="Split with another open chat" aria-label="Split with another open chat" data-icon="split"></button>
        </nav>

        <section class="scroller" id="scroller">
          <div class="thread" id="thread"></div>
        </section>

        <section class="stage" id="stage" hidden></section>

        <div class="asks" id="asks" aria-live="polite"></div>

        <div class="dock">
          <div class="place-line" id="place-line" role="status" hidden></div>
          <div class="plans" id="plans"></div>
          <div class="queue" id="queue"></div>
          <div class="palette" id="slash" hidden></div>
          <form class="composer" id="composer" autocomplete="off">
            <textarea id="input" rows="1" placeholder="Ask anything" spellcheck="true"></textarea>
            <div class="composer-bar">
              <button type="button" class="icon-btn attach" id="attach" title="Add files" aria-label="Add files" data-icon="plus"></button>
              <button type="button" class="chip place-chip" id="place-chip" hidden></button>
              <button type="button" class="chip model-chip" id="model-chip" title="Model"></button>
              <button type="button" class="chip mode-chip" id="mode-chip" title="Execution mode (⇧Tab)" aria-haspopup="menu">Manual</button>
              <button type="button" class="ctx-meter" id="ctx-ring" title="Context"></button>
              <button type="submit" class="send" id="send" aria-label="Send"></button>
            </div>
          </form>
        </div>
      </main>

      <aside class="pane" id="pane" aria-label="Side panel">
        <div class="pane-head" data-tauri-drag-region>
          <div class="pane-tabs" id="pane-tabs" role="tablist"></div>
          <button class="icon-btn" id="close-pane" title="Close (esc)" aria-label="Close"></button>
        </div>
        <div class="pane-body" id="pane-body"></div>
      </aside>
    </div>

    <div class="overlay" id="overlay" hidden></div>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
