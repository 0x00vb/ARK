[package]
name    = "agent-desktop-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
smallvec.workspace = true
agent-desktop-core.workspace = true
thiserror.workspace          = true
serde.workspace              = true
serde_json.workspace         = true
tracing.workspace            = true
base64.workspace             = true
rustc-hash.workspace         = true
libc.workspace               = true

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys  = "0.2.0"
core-foundation    = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics      = { version = "0.25.0", features = ["elcapitan", "highsierra"] }

[features]
dev-tools = []
interactive-tests = []

[[bin]]
name = "agent-desktop-macos-helper"
path = "src/bin/agent-desktop-macos-helper.rs"

[[example]]
name = "ax_probe"
required-features = ["dev-tools"]

[build-dependencies]

[lints]
workspace = true

[workspace]
resolver = "2"

[workspace.package]
edition      = "2024"
rust-version = "1.89"
license      = "Apache-2.0"
version      = "1.0.2"

[workspace.dependencies]
clap               = { version = "4.6", features = ["derive"] }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = { version = "1.0", features = ["float_roundtrip"] }
thiserror          = "2.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64             = "0.23"
rustc-hash         = "2.1"
libc               = "0.2"
smallvec           = { version = "1.13", features = ["serde", "union"] }
agent-desktop-core = { git = "https://github.com/vercel-labs/agent-desktop.git", rev = "a47ed664e0db00d1d4df364eb3fe8a5599882f3c" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub        = "allow"
unused_must_use        = "deny"
let_underscore_drop    = "allow"

[workspace.lints.clippy]
dbg_macro              = "deny"
todo                   = "warn"
needless_collect       = "warn"
redundant_clone        = "allow"
unwrap_used            = "allow"
expect_used            = "allow"
needless_pass_by_value = "allow"
manual_let_else        = "allow"
items_after_statements = "allow"
collapsible_if         = "allow"
print_stdout           = "allow"
print_stderr           = "allow"
